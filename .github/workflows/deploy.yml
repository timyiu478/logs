name: Deploy Zola Site to Cloudflare Pages

on:
  push:
    branches:
      - main # Change to 'master' if your primary branch uses that name
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true # Set to 'recursive' if using Zola themes added as submodules
          fetch-depth: 0

      - name: Build Zola Site
        uses: shalzz/zola-deploy-action@v0.19.2
        with:
          build_only: true
          # optional: set specific zola version if needed
          # version: "0.19.2"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: my-zola-site # Replace with your Cloudflare Pages project name
          directory: public # Default output directory for Zola
          gitBranch: main
