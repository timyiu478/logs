{% extends "base.html" %}

{% block content %}
<article class="log-card" id="log-{{ page.date }}">
    <div class="log-meta">
        <span class="badge-date">{{ page.date }}</span>
        {% if page.title and page.title != page.date %}
            <a href="{{ page.permalink }}" class="log-subtitle">{{ page.title }}</a>
        {% endif %}
    </div>
    {% if page.taxonomies.tags %}
        <div class="log-tags" aria-label="Tags">
            {% for tag in page.taxonomies.tags %}
                <button type="button" class="entry-tag" data-tag="{{ tag }}">[{{ tag }}]</button>
            {% endfor %}
        </div>
    {% endif %}
    <div class="log-body">
        {{ page.content | safe }}
    </div>
</article>
{% endblock %}
