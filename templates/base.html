<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="tdm-reservation" content="1" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Succinct Logs{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <canvas id="dynamic-art-bg"></canvas>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-sticky">
                <a href="/" class="brand-title">TY Succinct Logs</a>
                <p class="brand-desc">Bite-sized daily updates & quick notes.</p>

                <!-- Command + K Trigger Button -->
                <button id="search-trigger" class="search-trigger-btn">
                    <span>🔍 Search logs...</span>
                    <kbd>⌘K</kbd>
                </button>

                <div id="calendar-container"></div>
            </div>
        </aside>

        <main class="content-area">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Spotlight Search Modal -->
    <div id="search-modal" class="search-modal-overlay" style="display: none;">
        <div class="search-modal-container">
            <div class="search-modal-header">
                <input type="text" id="search-input" placeholder="Search all logs (type to filter...)" autocomplete="off">
                <kbd class="esc-key">ESC</kbd>
            </div>
            <div id="search-results" class="search-results-list"></div>
        </div>
    </div>

    <script>
        const logMap = {
            {% set logs = get_section(path="logs/_index.md", catch=true) %}
            {% if logs %}
                {% for page in logs.pages %}
                    "{{ page.date }}": "{{ page.permalink | safe }}",
                {% endfor %}
            {% endif %}
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/elasticlunr/0.9.6/elasticlunr.min.js"></script>
    <script src="/search_index.en.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/calendar.js"></script>
    <script src="/js/art.js"></script>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
      
      // 1. Initialize without auto-running
      mermaid.initialize({ 
        startOnLoad: false, 
        theme: 'default' // Matches your site's dark code blocks
      });

      document.addEventListener("DOMContentLoaded", async () => {
        // 2. Target Zola's specific data-lang attribute as well as standard classes
        const blocks = document.querySelectorAll(
          'pre[data-lang="mermaid"], code[data-lang="mermaid"], code.language-mermaid'
        );
        
        blocks.forEach((block) => {
          // If we grabbed the <code>, find its parent <pre> to replace the whole block
          const targetNode = block.tagName === 'CODE' ? block.closest('pre') || block : block;
          
          const div = document.createElement("div");
          div.className = "mermaid";
          
          // textContent safely extracts the raw markdown, ignoring any <span> 
          // tags Zola's syntax highlighter might have injected.
          div.textContent = block.textContent;
          
          targetNode.replaceWith(div);
        });

        // 3. Command Mermaid to parse the newly created divs
        await mermaid.run({
          querySelector: '.mermaid'
        });
    });
  </script>
</body>
</html>
